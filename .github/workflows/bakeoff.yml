name: Research Retrieval Bake-off v0.1

on:
  push:
    branches: [main]
    paths:
      - "frozen/**"
      - ".github/workflows/bakeoff.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  track-a:
    name: Track A / ${{ matrix.candidate }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        candidate: [scrapling, crawl4ai, playwright_cli]

    env:
      CI: "1"
      PYTHONUNBUFFERED: "1"
      BAKEOFF_BASE_URL: http://127.0.0.1:8765

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct and verify frozen benchmark
        shell: bash
        run: |
          set -euo pipefail
          cat frozen/part-*.b64 > /tmp/bakeoff.b64
          echo "1a47abd3e3d309c13cfb8e0600b92c6174aea35ae8153149e587f147be1e818b  /tmp/bakeoff.b64" | sha256sum -c -
          base64 --decode /tmp/bakeoff.b64 > /tmp/bakeoff.zip
          echo "a8a6644ff4ae5c841ab608c0dea5928eaed39c9f54ff816fffd11eb18de03171  /tmp/bakeoff.zip" | sha256sum -c -
          mkdir benchmark
          unzip -q /tmp/bakeoff.zip -d benchmark
          test "$(grep -E '^version:' benchmark/benchmark.yaml | head -1 | tr -d ' "' | cut -d: -f2)" = "0.1"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install benchmark helpers
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests beautifulsoup4

      - name: Install Scrapling 0.4.15
        if: matrix.candidate == 'scrapling'
        run: |
          python -m pip install "scrapling[rag]==0.4.15"
          python -m playwright install --with-deps chromium
          python - <<'PY' >> "$GITHUB_ENV"
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              print(f"CHROMIUM_PATH={p.chromium.executable_path}")
          PY
          python - <<'PY'
          import importlib.metadata
          assert importlib.metadata.version("scrapling") == "0.4.15"
          PY

      - name: Install Crawl4AI 0.9.4
        if: matrix.candidate == 'crawl4ai'
        run: |
          python -m pip install "crawl4ai==0.9.4"
          crawl4ai-setup
          python - <<'PY'
          import importlib.metadata
          assert importlib.metadata.version("crawl4ai") == "0.9.4"
          PY

      - name: Install Playwright CLI 0.1.21
        if: matrix.candidate == 'playwright_cli'
        run: |
          npm install -g @playwright/cli@0.1.21
          playwright-cli install-browser chromium
          echo "PLAYWRIGHT_MCP_BROWSER=chromium" >> "$GITHUB_ENV"
          playwright-cli --version | tee /tmp/playwright-cli-version.txt
          grep -F "0.1.21" /tmp/playwright-cli-version.txt

      - name: Record resolved environment
        run: |
          mkdir -p benchmark/results/raw
          {
            echo "candidate=${{ matrix.candidate }}"
            python --version
            node --version
            npm --version
            echo "--- pip freeze ---"
            python -m pip freeze
            if command -v playwright-cli >/dev/null 2>&1; then
              echo "--- playwright-cli ---"
              playwright-cli --version
            fi
          } > "benchmark/results/environment-${{ matrix.candidate }}.txt"

      - name: Start frozen fixture server
        run: |
          cd benchmark
          python benchmark_server.py --port 8765 > server.log 2>&1 &
          echo $! > server.pid
          for i in {1..40}; do
            if curl --fail --silent http://127.0.0.1:8765/__health >/dev/null; then
              exit 0
            fi
            sleep 0.25
          done
          cat server.log
          exit 1

      - name: Run Track A - three repeats per task
        run: |
          cd benchmark
          python run_track_a.py "${{ matrix.candidate }}"

      - name: Grade Track A
        if: always()
        run: |
          cd benchmark
          if [ -f "results/${{ matrix.candidate }}.json" ]; then
            python grade.py "results/${{ matrix.candidate }}.json" | tee "results/${{ matrix.candidate }}.grade.json"
          else
            printf '{"candidate":"%s","error":"result file missing"}\n' "${{ matrix.candidate }}" | tee "results/${{ matrix.candidate }}.grade.json"
          fi

      - name: Upload candidate results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: track-a-${{ matrix.candidate }}
          path: |
            benchmark/results/
            benchmark/server.log
          retention-days: 30
