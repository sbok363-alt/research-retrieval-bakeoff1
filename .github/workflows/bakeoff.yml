name: Research Retrieval Bake-off v0.1

on:
  push:
    branches: [main]
    paths:
      - "frozen/**"
      - ".github/workflows/bakeoff.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  track-a:
    name: Track A / ${{ matrix.candidate }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        candidate: [scrapling, crawl4ai, playwright_cli]

    env:
      CI: "1"
      PYTHONUNBUFFERED: "1"
      BAKEOFF_BASE_URL: http://127.0.0.1:8765

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct and verify frozen benchmark
        shell: bash
        run: |
          set -euo pipefail
          cat frozen/part-*.b64 > /tmp/bakeoff.b64
          echo "1a47abd3e3d309c13cfb8e0600b92c6174aea35ae8153149e587f147be1e818b  /tmp/bakeoff.b64" | sha256sum -c -
          base64 --decode /tmp/bakeoff.b64 > /tmp/bakeoff.zip
          echo "a8a6644ff4ae5c841ab608c0dea5928eaed39c9f54ff816fffd11eb18de03171  /tmp/bakeoff.zip" | sha256sum -c -
          mkdir benchmark
          unzip -q /tmp/bakeoff.zip -d benchmark
          test "$(grep -E '^version:' benchmark/benchmark.yaml | head -1 | tr -d ' "' | cut -d: -f2)" = "0.1"


      - name: Apply adapter compatibility corrections v0.1.1
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace1(rel, old, new):
              p = Path("benchmark") / rel
              s = p.read_text()
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f"{rel}: expected exactly one compatibility target, found {n}")
              p.write_text(s.replace(old, new, 1))

          # B04: page query is part of pagination identity; canonical_url()
          # removes queries for crawl dedupe, so using it here collapsed pages 1/2/3.
          replace1(
              "adapters/scrapling_adapter.py",
              """        while url and canonical_url(url) not in seen_pages:
                      seen_pages.add(canonical_url(url))""",
              """        while url and url not in seen_pages:
                      seen_pages.add(url)""",
          )
          replace1(
              "adapters/crawl4ai_adapter.py",
              """            while url and canonical_url(url) not in seen_pages:
                          seen_pages.add(canonical_url(url))""",
              """            while url and url not in seen_pages:
                          seen_pages.add(url)""",
          )

          # B05: ok means the adapter executed. The grader already judges the
          # returned HTTP status + fact. Crawl4AI returned both correctly even
          # when its library-level success flag was false.
          replace1(
              "adapters/crawl4ai_adapter.py",
              """            return result(bool(r2.success), out, visible, ops=2, attempts=2)""",
              """            return result(True, out, visible, ops=2, attempts=2, notes=f"crawl4ai success={bool(r2.success)}; error={getattr(r2, 'error_message', '')!r}")""",
          )

          # Playwright CLI run-code does not expose the global URL constructor in
          # its outer sandbox. URL remains available inside page.evaluate().
          replace1(
              "adapters/playwright_cli_adapter.py",
              """                const origin = new URL(page.url()).origin;""",
              """                const origin = await page.evaluate(() => location.origin);""",
          )
          replace1(
              "adapters/playwright_cli_adapter.py",
              """                  const next=q.shift(); const u=new URL(next); u.hash=''; u.search=''; const canon=u.toString();
                          if(seen.has(canon)) continue; seen.add(canon);
                          await page.goto(canon); await page.waitForLoadState('domcontentloaded');
                          counts[u.pathname]=(counts[u.pathname]||0)+1;
                          if(u.pathname!='/docs/') {
                            pages.add(u.pathname);""",
              """                  const next=q.shift();
                          const metaUrl=await page.evaluate((raw) => { const u=new URL(raw); u.hash=''; u.search=''; return {canon:u.toString(), pathname:u.pathname}; }, next);
                          const canon=metaUrl.canon;
                          if(seen.has(canon)) continue; seen.add(canon);
                          await page.goto(canon); await page.waitForLoadState('domcontentloaded');
                          counts[metaUrl.pathname]=(counts[metaUrl.pathname]||0)+1;
                          if(metaUrl.pathname!='/docs/') {
                            pages.add(metaUrl.pathname);""",
          )
          replace1(
              "adapters/playwright_cli_adapter.py",
              """                  const hrefs=await page.locator('a[href]').evaluateAll(as=>as.map(a=>a.href));
                          for(const h of hrefs){ const v=new URL(h); v.hash=''; v.search=''; if(v.origin===origin && v.pathname.startsWith('/docs/') && !seen.has(v.toString())) q.push(v.toString()); }""",
              """                  const links=await page.locator('a[href]').evaluateAll(as=>as.map(a=>{ const v=new URL(a.href); v.hash=''; v.search=''; return {origin:v.origin, pathname:v.pathname, canon:v.toString()}; }));
                          for(const v of links){ if(v.origin===origin && v.pathname.startsWith('/docs/') && !seen.has(v.canon)) q.push(v.canon); }""",
          )
          replace1(
              "adapters/playwright_cli_adapter.py",
              """                const href=await page.locator('a[href]').first().getAttribute('href');
                          const response=await page.goto(new URL(href, page.url()).toString()); await page.waitForLoadState('domcontentloaded');""",
              """                const href=await page.locator('a[href]').first().evaluate(a=>a.href);
                          const response=await page.goto(href); await page.waitForLoadState('domcontentloaded');""",
          )

          Path("benchmark/results").mkdir(parents=True, exist_ok=True)
          Path("benchmark/results/adapter-revision.txt").write_text("0.1.1-compat\\n")
          PY

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install benchmark helpers
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests beautifulsoup4

      - name: Install Scrapling 0.4.15
        if: matrix.candidate == 'scrapling'
        run: |
          python -m pip install "scrapling[rag]==0.4.15"
          python -m playwright install --with-deps chromium
          python - <<'PY' >> "$GITHUB_ENV"
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              print(f"CHROMIUM_PATH={p.chromium.executable_path}")
          PY
          python - <<'PY'
          import importlib.metadata
          assert importlib.metadata.version("scrapling") == "0.4.15"
          PY

      - name: Install Crawl4AI 0.9.4
        if: matrix.candidate == 'crawl4ai'
        run: |
          python -m pip install "crawl4ai==0.9.4"
          crawl4ai-setup
          python - <<'PY'
          import importlib.metadata
          assert importlib.metadata.version("crawl4ai") == "0.9.4"
          PY

      - name: Install Playwright CLI 0.1.21
        if: matrix.candidate == 'playwright_cli'
        run: |
          npm install -g @playwright/cli@0.1.21
          playwright-cli install-browser chromium
          echo "PLAYWRIGHT_MCP_BROWSER=chromium" >> "$GITHUB_ENV"
          playwright-cli --version | tee /tmp/playwright-cli-version.txt
          grep -F "0.1.21" /tmp/playwright-cli-version.txt

      - name: Record resolved environment
        run: |
          mkdir -p benchmark/results/raw
          {
            echo "candidate=${{ matrix.candidate }}"
            python --version
            node --version
            npm --version
            echo "--- pip freeze ---"
            python -m pip freeze
            if command -v playwright-cli >/dev/null 2>&1; then
              echo "--- playwright-cli ---"
              playwright-cli --version
            fi
          } > "benchmark/results/environment-${{ matrix.candidate }}.txt"

      - name: Start frozen fixture server
        run: |
          cd benchmark
          python benchmark_server.py --port 8765 > server.log 2>&1 &
          echo $! > server.pid
          for i in {1..40}; do
            if curl --fail --silent http://127.0.0.1:8765/__health >/dev/null; then
              exit 0
            fi
            sleep 0.25
          done
          cat server.log
          exit 1

      - name: Run Track A - three repeats per task
        run: |
          cd benchmark
          python run_track_a.py "${{ matrix.candidate }}"

      - name: Grade Track A
        if: always()
        run: |
          cd benchmark
          if [ -f "results/${{ matrix.candidate }}.json" ]; then
            python grade.py "results/${{ matrix.candidate }}.json" | tee "results/${{ matrix.candidate }}.grade.json"
          else
            printf '{"candidate":"%s","error":"result file missing"}\n' "${{ matrix.candidate }}" | tee "results/${{ matrix.candidate }}.grade.json"
          fi

      - name: Upload candidate results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: track-a-${{ matrix.candidate }}
          path: |
            benchmark/results/
            benchmark/server.log
          retention-days: 30
